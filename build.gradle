plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Jade asserts every plugin's config translations under -ea; players never run with assertions.
            jvmArgument '-da'
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runShots : DEV ONLY, builds scenes with Bubies at work and saves screenshots (client/ShotDirector)
        shots {
            client()
            systemProperty 'bubie.shots', 'true'
            // -PdjShots=<audio link>: only the DJ scene (face, menu tab) and a streamed link, checked in the log
            if (project.hasProperty('djShots')) systemProperty 'bubie.djshots', project.property('djShots').toString()
            jvmArgument '-da'
            programArguments.addAll('--quickPlaySingleplayer', 'Shots', '--width', '1920', '--height', '1080')
        }
        // ./gradlew runTrailer : DEV ONLY, records the trailer (client/TrailerDirector) with Iris + Complementary from
        // runs/trailer (mods/, shaderpacks/), as the player yay99857 so the skin is theirs. Frames go to runs/trailer/frames.
        trailer {
            client()
            gameDirectory = project.file('runs/trailer')
            systemProperty 'bubie.trailer', project.findProperty('trailerShot')?.toString() ?: 'all'
            systemProperty 'bubie.ffmpeg', System.getenv('FFMPEG') ?: 'ffmpeg'
            jvmArguments.addAll('-Xmx4G', '-da')
            programArguments.addAll('--quickPlaySingleplayer', 'Trailer', '--width', '1920', '--height', '1080',
                    '--username', 'yay99857', '--uuid', '6658ea8afd9c45788af9e2f0ae723c11')
        }
        // ./gradlew runVoltaicShots : DEV ONLY, screenshots of Voltaic Dynamics machines (client/trailer/VoltaicShots) for its
        // page, with the shaders of runs/trailer; put the voltaicdynamics jar in runs/trailer/mods first.
        voltaicShots {
            client()
            gameDirectory = project.file('runs/trailer')
            systemProperty 'bubie.voltaicshots', 'true'
            jvmArguments.addAll('-Xmx4G', '-da')
            programArguments.addAll('--quickPlaySingleplayer', 'VoltaicShots', '--width', '1920', '--height', '1080')
        }
        // ./gradlew runPackGameTest : the same tests with the Bubie Pack's mods loaded (tools/prepare-pack-test.sh first)
        packGameTest {
            type = "gameTestServer"
            gameDirectory = project.file('runs/pack-test')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Xmx4G'
        }
        // ./gradlew runLogos : DEV ONLY, renders the 3D logo squares (client/LogoScreen); then python tools/crop_logos.py
        logos {
            client()
            systemProperty 'bubie.logos', 'true'
            jvmArgument '-da'
            programArguments.addAll('--quickPlaySingleplayer', 'Shots', '--width', '1920', '--height', '1080')
        }
        // ./gradlew runGameTestServer : runs every @GameTest and exits (non-zero on failure)
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('jfr')) jvmArgument '-XX:StartFlightRecording=filename=' + project.property('jfr') + ',settings=profile'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    // Jade at the exact version shipped in Bubie Pack (CurseForge file id).
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // The DJ decodes .mp3 links with JLayer (pure Java, LGPL 2.1), shipped inside the jar (Jar-in-Jar).
    jarJar(implementation('javazoom:jlayer:[1.0.1,2)')) {
        version { prefer '1.0.1' }
    }
    additionalRuntimeClasspath 'javazoom:jlayer:1.0.1'

    // Optional integration: compiled against, never required at runtime (see compat/jade).
    compileOnly 'curse.maven:jade-324717:8591319'   // Jade 15.10.6
    runtimeOnly 'curse.maven:jade-324717:8591319'
    // Optional: the Builder job reads Base Blueprint's plan (see compat/BlueprintCompat). Loaded in dev for the tests.
    // 1.3.0 adds HelperBuildEvent (its menu's "Build with Bubie" button); Bubie still runs with 1.2.1. A jar built
    // next door (../base-blueprint) wins, so changes there can be tried before they are on CurseForge.
    def bb = file('../base-blueprint/build/libs/baseblueprint-1.3.0.jar')
    if (bb.exists()) {
        compileOnly files(bb)
        runtimeOnly files(bb)
    } else {
        compileOnly 'curse.maven:base-blueprint-1809447:9719130'   // Base Blueprint 1.3.0
        runtimeOnly 'curse.maven:base-blueprint-1809447:9719130'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

var modMetadata = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_license            : mod_license,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
]
processResources {
    inputs.properties modMetadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modMetadata
    }
}
