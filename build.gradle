plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'com.gradleup.shadow' version '8.3.6'
}

// Forge 1.20.1 backport of Bubie 1.5.0. Frozen: bug fixes only, new features go to the NeoForge 1.21.1 version (main).
version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-forge-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            // Jade asserts every plugin's config translations under -ea; players never run with assertions.
            jvmArgument '-da'
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runGameTestServer : runs every @GameTest and exits (non-zero on failure)
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    shade
}

dependencies {
    // The DJ decodes .mp3 links with JLayer (pure Java, LGPL 2.1). Forge 1.20.1 only loads a jar inside a jar when it
    // declares itself a library, which JLayer doesn't, so its classes go into the mod jar, moved to a package of their own.
    implementation 'javazoom:jlayer:1.0.1'
    shade 'javazoom:jlayer:1.0.1'
    additionalRuntimeClasspath 'javazoom:jlayer:1.0.1'

    // Optional integration: compiled against, never required at runtime (see compat/jade).
    modCompileOnly 'maven.modrinth:jade:11.13.3+forge'
    modRuntimeOnly 'maven.modrinth:jade:11.13.3+forge'
}

// build/libs/bubie-forge-<mc>-<version>.jar is the one to publish: the mod with JLayer inside, reobfuscated for Forge.
jar {
    archiveClassifier = 'slim'
}
shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'javazoom', 'com.bubie.shadow.javazoom'
}
obfuscation {
    reobfuscate(tasks.named('shadowJar'), sourceSets.main)
}
assemble.dependsOn shadowJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

var modMetadata = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_license            : mod_license,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
]
processResources {
    inputs.properties modMetadata
    filesMatching('META-INF/mods.toml') {
        expand modMetadata
    }
}
